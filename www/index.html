<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic Wood Number Puzzle</title>
  <style>
    :root {
      --wood-dark: #3e2213;
      --wood-frame: #5c341e;
      --wood-board: #2b180d;
      --wood-tile: linear-gradient(145deg, #e7c293, #c59b65);
      --wood-tile-border: #8b5a2b;
      --wood-tile-shadow: #1e1109;
      --text-color: #3e2213;
      --accent: #f5c542;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--wood-dark);
      background-image: radial-gradient(#4d2b17 15%, transparent 16%), radial-gradient(#4d2b17 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      padding: 16px 12px 75px 12px;
      overflow-x: hidden;
    }

    /* HOME SCREEN */
    #homeScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      background: linear-gradient(145deg, #5c341e, #3e2213);
      padding: 26px 18px;
      border-radius: 16px;
      border: 2px solid var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
    }

    .game-logo {
      width: 90px;
      height: 90px;
      background: var(--wood-tile);
      border: 3px solid var(--wood-tile-border);
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      padding: 6px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      margin-bottom: 12px;
    }

    .mini-tile {
      background: #c59b65;
      color: #3e2213;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 1rem;
    }

    .menu-title {
      font-size: 1.7rem;
      color: var(--accent);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    .menu-subtitle {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 18px;
    }

    .menu-btn {
      width: 85%;
      padding: 11px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .menu-btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(145deg, #f5c542, #c99c1e);
      color: #2b180d;
    }

    .btn-secondary {
      background: linear-gradient(145deg, #8b5a2b, #5c341e);
      color: #fff;
      border: 1px solid #a76d35;
    }

    /* LEVEL MAP SCREEN */
    #levelSelectScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }

    .level-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .nav-btn {
      background: linear-gradient(145deg, #8b5a2b, #5c341e);
      color: #fff;
      border: 1px solid #a76d35;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
      max-height: 54vh;
      overflow-y: auto;
    }

    .level-box {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      border: 1px solid #8b5a2b;
      position: relative;
    }

    .level-box.unlocked {
      background: var(--wood-tile);
      color: var(--text-color);
    }

    .level-box.current {
      background: linear-gradient(145deg, #f5c542, #e0a81d);
      color: #2b180d;
      border: 2px solid #fff;
    }

    .level-box.locked {
      background: #2b180d;
      color: #777;
      border: 1px solid #442211;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .level-stars {
      font-size: 0.6rem;
      color: #ffd700;
      margin-top: 1px;
    }

    /* GAME PLAY SCREEN */
    #gameScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 360px;
      margin-bottom: 10px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 360px;
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .stat-val {
      font-weight: bold;
      color: var(--accent);
      font-size: 0.95rem;
    }

    .board-container {
      position: relative;
      background: var(--wood-frame);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.2), inset 0 -4px 8px rgba(0,0,0,0.5);
      border: 2px solid #3e2213;
    }

    .board {
      display: grid;
      background: var(--wood-board);
      border-radius: 8px;
      gap: 6px;
      width: 86vw;
      height: 86vw;
      max-width: 340px;
      max-height: 340px;
      padding: 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
    }

    .tile {
      background: var(--wood-tile);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      border-radius: 6px;
      box-shadow: 0 4px 0 var(--wood-tile-shadow), 0 5px 8px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.6);
      border: 1px solid var(--wood-tile-border);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.3s ease;
    }

    .tile.hint-highlight {
      background: #ffd700 !important;
      border: 2px solid #fff !important;
      animation: pulse 0.7s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.96); }
      to { transform: scale(1.04); }
    }

    .tile.empty {
      visibility: hidden;
      box-shadow: none;
      border: none;
    }

    .controls-bottom {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .action-btn {
      background: linear-gradient(145deg, #8b5a2b, #5c341e);
      color: #fff;
      border: 1px solid #a76d35;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .hint-btn {
      background: linear-gradient(145deg, #ffd700, #c99c1e);
      color: #2b180d;
      border: 1px solid #ffd700;
    }

    /* WIN MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-card {
      background: linear-gradient(145deg, #5c341e, #3e2213);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }

    .stars-display {
      font-size: 2rem;
      color: #ffd700;
      margin: 10px 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="homeScreen">
    <div class="game-logo">
      <div class="mini-tile">1</div>
      <div class="mini-tile">2</div>
      <div class="mini-tile">3</div>
      <div class="mini-tile" style="visibility:hidden"></div>
    </div>
    <h1 class="menu-title">Wood Puzzle</h1>
    <p class="menu-subtitle">10,000 Levels Challenge</p>

    <button class="menu-btn btn-primary" onclick="playCurrentLevel()">Continue Game</button>
    <button class="menu-btn btn-secondary" onclick="openLevelSelect()">Select Level</button>
    
    <div style="margin-top: 10px; display:flex; gap:10px; align-items:center;">
      <select id="gridSizeSelect" onchange="changeDifficulty(this.value)" style="padding: 4px 8px; background: #3e2213; color: #fff; border: 1px solid #a76d35; border-radius: 4px;">
        <option value="3">3 x 3 (Easy)</option>
        <option value="4" selected>4 x 4 (Classic 15)</option>
        <option value="5">5 x 5 (Hard)</option>
      </select>
      <button class="action-btn" id="soundToggleBtn" onclick="toggleSound()">🔊 Sound ON</button>
    </div>
  </div>

  <!-- LEVEL SELECTION SCREEN -->
  <div id="levelSelectScreen">
    <header>
      <button class="action-btn" onclick="backToHomeFromLevels()">❮ Home</button>
      <h2 style="font-size: 1.1rem; color: var(--accent);">Choose Level</h2>
      <div style="width: 50px;"></div>
    </header>

    <div class="level-nav-bar">
      <button class="nav-btn" id="prevPageBtn" onclick="changePage(-1)">❮ Prev</button>
      <span id="pageIndicator" style="font-size: 0.9rem; font-weight: bold; color: var(--accent);">1 - 50</span>
      <button class="nav-btn" id="nextPageBtn" onclick="changePage(1)">Next ❯</button>
    </div>

    <div class="level-grid" id="levelsContainer"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen">
    <header>
      <button class="action-btn" onclick="openLevelSelect()">☰ Levels</button>
      <h2 style="font-size: 1.1rem; color: var(--accent);">Wood Puzzle</h2>
      <button class="action-btn" onclick="goToHome()">Home</button>
    </header>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Level</span>
        <span class="stat-val" id="levelIndicator">1</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Moves</span>
        <span class="stat-val" id="moves">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Time</span>
        <span class="stat-val" id="timer">00:00</span>
      </div>
    </div>

    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <div class="controls-bottom">
      <button class="action-btn" onclick="restartLevel()">Restart</button>
      <button class="action-btn" onclick="undoMove()">Undo</button>
      <button class="action-btn hint-btn" onclick="triggerHintWithAd()">💡 Hint</button>
    </div>
  </div>

  <!-- WIN MODAL -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <h2 id="winTitle" style="color: var(--accent);">Level Solved!</h2>
      <div class="stars-display" id="winStars">⭐⭐⭐</div>
      <p id="winStats" style="margin-bottom: 14px; font-size: 0.9rem;">Moves: 0 | Time: 00:00</p>
      <button class="menu-btn btn-primary" onclick="closeWinModalAndNext()">Next Level</button>
    </div>
  </div>

  <script>
    let size = 4;
    let tiles = [];
    let moveHistory = [];
    let moves = 0;
    let timer = 0;
    let timerInterval = null;
    let isPlaying = false;
    let soundEnabled = true;

    // Progression & Ratings
    let maxUnlockedLevel = parseInt(localStorage.getItem('woodPuzzle_unlocked')) || 1;
    let activeLevel = maxUnlockedLevel;
    let levelStarsData = JSON.parse(localStorage.getItem('woodPuzzle_stars') || '{}');

    // 10,000 Levels Pagination
    let currentPage = Math.floor((activeLevel - 1) / 50);
    const LEVELS_PER_PAGE = 50;
    const MAX_TOTAL_LEVELS = 10000;

    // Elements
    const homeScreen = document.getElementById('homeScreen');
    const levelSelectScreen = document.getElementById('levelSelectScreen');
    const gameScreen = document.getElementById('gameScreen');
    const levelsContainer = document.getElementById('levelsContainer');
    const pageIndicator = document.getElementById('pageIndicator');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const timerEl = document.getElementById('timer');
    const levelDisplay = document.getElementById('levelIndicator');

    // 1. SOUND & HAPTIC SYSTEM (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playWoodClickSound() {
      if (!soundEnabled) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function triggerHaptic() {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(25);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊 Sound ON' : '🔇 Mute';
    }

    // NAVIGATION
    function playCurrentLevel() {
      activeLevel = maxUnlockedLevel;
      startSelectedLevel(activeLevel);
    }

    function openLevelSelect() {
      stopTimer();
      homeScreen.style.display = 'none';
      gameScreen.style.display = 'none';
      levelSelectScreen.style.display = 'flex';
      currentPage = Math.floor((activeLevel - 1) / LEVELS_PER_PAGE);
      renderLevelsPage();
    }

    function backToHomeFromLevels() {
      levelSelectScreen.style.display = 'none';
      homeScreen.style.display = 'flex';
    }

    function goToHome() {
      stopTimer();
      gameScreen.style.display = 'none';
      homeScreen.style.display = 'flex';
    }

    function renderLevelsPage() {
      levelsContainer.innerHTML = '';
      const startLevel = currentPage * LEVELS_PER_PAGE + 1;
      const endLevel = Math.min(startLevel + LEVELS_PER_PAGE - 1, MAX_TOTAL_LEVELS);

      pageIndicator.textContent = `${startLevel} - ${endLevel}`;
      prevPageBtn.disabled = currentPage === 0;
      nextPageBtn.disabled = endLevel >= MAX_TOTAL_LEVELS;

      for (let lvl = startLevel; lvl <= endLevel; lvl++) {
        const box = document.createElement('div');
        box.classList.add('level-box');

        if (lvl <= maxUnlockedLevel) {
          box.classList.add('unlocked');
          if (lvl === activeLevel) box.classList.add('current');
          const starCount = levelStarsData[lvl] || 0;
          box.innerHTML = `<span>${lvl}</span><span class="level-stars">${'⭐'.repeat(starCount)}</span>`;
          box.onclick = () => startSelectedLevel(lvl);
        } else {
          box.classList.add('locked');
          box.innerHTML = '🔒';
        }
        levelsContainer.appendChild(box);
      }
    }

    function changePage(delta) {
      currentPage += delta;
      renderLevelsPage();
    }

    function startSelectedLevel(lvl) {
      activeLevel = lvl;
      levelSelectScreen.style.display = 'none';
      homeScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      initGame();
    }

    // GAME LOOP
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer++;
        const mins = String(Math.floor(timer / 60)).padStart(2, '0');
        const secs = String(timer % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function updateUI() {
      movesEl.textContent = moves;
      if (levelDisplay) levelDisplay.textContent = `${activeLevel}`;
    }

    function changeDifficulty(newSize) {
      size = parseInt(newSize);
    }

    function initGame() {
      stopTimer();
      moves = 0;
      timer = 0;
      timerEl.textContent = "00:00";
      moveHistory = [];
      isPlaying = false;
      updateUI();

      boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${size}, 1fr)`;

      generateSolvableBoard();
      renderBoard();
    }

    function restartLevel() {
      initGame();
    }

    function generateSolvableBoard() {
      const totalTiles = size * size;
      tiles = Array.from({ length: totalTiles - 1 }, (_, i) => i + 1);
      tiles.push(0);

      const shuffleSteps = Math.min(4 + Math.floor(activeLevel * 1.5), 90);
      let emptyIdx = totalTiles - 1;

      for (let s = 0; s < shuffleSteps; s++) {
        const validNeighbors = [];
        const r = Math.floor(emptyIdx / size);
        const c = emptyIdx % size;

        if (r > 0) validNeighbors.push(emptyIdx - size);
        if (r < size - 1) validNeighbors.push(emptyIdx + size);
        if (c > 0) validNeighbors.push(emptyIdx - 1);
        if (c < size - 1) validNeighbors.push(emptyIdx + 1);

        const chosenIdx = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
        [tiles[emptyIdx], tiles[chosenIdx]] = [tiles[chosenIdx], tiles[emptyIdx]];
        emptyIdx = chosenIdx;
      }

      if (isSolved()) {
        const swapIdx = emptyIdx === 0 ? 1 : 0;
        [tiles[emptyIdx], tiles[swapIdx]] = [tiles[swapIdx], tiles[emptyIdx]];
      }
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      tiles.forEach((val, idx) => {
        const tileEl = document.createElement('div');
        tileEl.classList.add('tile');
        tileEl.id = `tile-${idx}`;
        if (val === 0) {
          tileEl.classList.add('empty');
        } else {
          tileEl.textContent = val;
          tileEl.onclick = () => handleTileClick(idx);
        }
        boardEl.appendChild(tileEl);
      });
    }

    function handleTileClick(idx) {
      const emptyIdx = tiles.indexOf(0);
      const r1 = Math.floor(idx / size), c1 = idx % size;
      const r2 = Math.floor(emptyIdx / size), c2 = emptyIdx % size;

      if ((Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1) {
        playWoodClickSound();
        triggerHaptic();

        if (!isPlaying) {
          isPlaying = true;
          startTimer();
        }

        moveHistory.push([...tiles]);
        [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
        moves++;
        updateUI();
        renderBoard();

        if (isSolved()) {
          stopTimer();
          onPuzzleSolved();
        }
      }
    }

    function undoMove() {
      if (moveHistory.length > 0) {
        playWoodClickSound();
        tiles = moveHistory.pop();
        moves++;
        updateUI();
        renderBoard();
      }
    }

    function isSolved() {
      for (let i = 0; i < tiles.length - 1; i++) {
        if (tiles[i] !== i + 1) return false;
      }
      return tiles[tiles.length - 1] === 0;
    }

    // 2. STAR RATING SYSTEM & WIN FLOW
    function calculateStars() {
      const expectedMoves = 10 + Math.floor(activeLevel * 1.5);
      if (moves <= expectedMoves) return 3;
      if (moves <= expectedMoves * 1.8) return 2;
      return 1;
    }

    function onPuzzleSolved() {
      const stars = calculateStars();
      levelStarsData[activeLevel] = Math.max(levelStarsData[activeLevel] || 0, stars);
      localStorage.setItem('woodPuzzle_stars', JSON.stringify(levelStarsData));

      document.getElementById('winTitle').textContent = `Level ${activeLevel} Complete!`;
      document.getElementById('winStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
      document.getElementById('winStats').textContent = `Moves: ${moves} | Time: ${timerEl.textContent}`;
      document.getElementById('winModal').style.display = 'flex';

      if (activeLevel >= maxUnlockedLevel) {
        maxUnlockedLevel = Math.min(activeLevel + 1, MAX_TOTAL_LEVELS);
        localStorage.setItem('woodPuzzle_unlocked', maxUnlockedLevel);
      }

      // 3. INTERSTITIAL AD TRIGGER (Every 2 levels)
      if (activeLevel % 2 === 0) {
        showInterstitialAd();
      }
    }

    function closeWinModalAndNext() {
      document.getElementById('winModal').style.display = 'none';
      if (activeLevel < MAX_TOTAL_LEVELS) {
        activeLevel++;
      }
      initGame();
    }

    // 4. HINT FEATURE (Animated guidance)
    function triggerHintWithAd() {
      const emptyIdx = tiles.indexOf(0);
      const validNeighbors = [];
      const r = Math.floor(emptyIdx / size);
      const c = emptyIdx % size;

      if (r > 0) validNeighbors.push(emptyIdx - size);
      if (r < size - 1) validNeighbors.push(emptyIdx + size);
      if (c > 0) validNeighbors.push(emptyIdx - 1);
      if (c < size - 1) validNeighbors.push(emptyIdx + 1);

      // Pick best tile candidate to move
      const targetIdx = validNeighbors[0];
      const targetTileEl = document.getElementById(`tile-${targetIdx}`);
      if (targetTileEl) {
        targetTileEl.classList.add('hint-highlight');
        setTimeout(() => targetTileEl.classList.remove('hint-highlight'), 1800);
      }
    }

    // 5. ADMOB INTEGRATION (Banner + Interstitial)
    async function initAdMob() {
      try {
        if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AdMob) return;
        const { AdMob, BannerAdSize, BannerAdPosition } = window.Capacitor.Plugins;
        await AdMob.initialize();

        // Banner Ad
        await AdMob.showBanner({
          adId: 'ca-app-pub-3129876015229913/7261798836',
          adSize: BannerAdSize.BANNER,
          position: BannerAdPosition.BOTTOM_CENTER,
          margin: 0,
          isTesting: false
        });

        // Prepare Interstitial Ad
        await AdMob.prepareInterstitial({
          adId:'ca-app-pub-3129876015229913/9065660083', // Replace with Interstitial Unit ID when created
          isTesting: false
        });
      } catch (e) {
        console.error('AdMob error:', e);
      }
    }

    async function showInterstitialAd() {
      try {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
          await window.Capacitor.Plugins.AdMob.showInterstitial();
        }
      } catch (e) {
        console.log('Interstitial ad not ready or failed to display');
      }
    }

    initAdMob();
    // Android Hardware / Gesture Back Button Handling
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      const { App } = window.Capacitor.Plugins;
      App.addListener('backButton', ({ canGoBack }) => {
        const winModal = document.getElementById('winModal');
        
        // 1. Agar win popup khula ho toh close karein
        if (winModal && winModal.style.display === 'flex') {
          closeWinModalAndNext();
          return;
        }

        // 2. Agar Level Map screen par hon toh Home par jayein
        if (levelSelectScreen && levelSelectScreen.style.display === 'flex') {
          backToHomeFromLevels();
          return;
        }

        // 3. Agar Game play screen par hon toh Home par jayein
        if (gameScreen && gameScreen.style.display === 'flex') {
          goToHome();
          return;
        }

        // 4. Agar already Home par hon toh app exit karein
        App.exitApp();
      });
    }
  </script>
</body>
</html>
